<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GIGA Klima Logger</title>
<style>
:root{--bg:#0f172a;--card:#111827;--line:#263244;--text:#e5e7eb;--muted:#94a3b8;--accent:#38bdf8}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Arial,Helvetica,sans-serif}main{max-width:1200px;margin:auto;padding:24px}
header{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}h1{margin:0;font-size:28px}
button{border:1px solid var(--line);background:#172033;color:var(--text);padding:10px 14px;border-radius:10px;cursor:pointer}.status{color:var(--muted);font-size:14px}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:16px}.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:20px}.full{grid-column:1/-1}
.value{font-size:44px;font-weight:700;margin:8px 0}.label{color:var(--muted)}.small{font-size:13px;color:var(--muted)}
.chart{width:100%;height:260px;background:#0b1220;border-radius:12px;margin-top:10px}table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:9px;border-bottom:1px solid var(--line);font-size:14px}th{color:var(--muted)}
@media(max-width:700px){.grid{grid-template-columns:1fr}.full{grid-column:auto}header{align-items:flex-start;flex-direction:column;gap:12px}}
</style></head><body><main><header><div><h1>GIGA Klima Logger</h1><div id="status" class="status">Verbinde …</div></div><button onclick="location.href='/api/history.csv'">CSV herunterladen</button></header>
<section class="grid"><div class="card"><div class="label">Temperatur</div><div id="temp" class="value">-- °C</div><div id="time" class="small">--</div></div>
<div class="card"><div class="label">Luftfeuchtigkeit</div><div id="hum" class="value">-- %</div><div id="time2" class="small">--</div></div>
<div class="card full"><div class="label">Temperaturverlauf</div><svg id="tc" class="chart" viewBox="0 0 1000 260" preserveAspectRatio="none"></svg></div>
<div class="card full"><div class="label">Luftfeuchtigkeitsverlauf</div><svg id="hc" class="chart" viewBox="0 0 1000 260" preserveAspectRatio="none"></svg></div>
<div class="card full"><div class="label">Letzte Messungen</div><table><thead><tr><th>Zeit</th><th>Temperatur</th><th>Luftfeuchtigkeit</th></tr></thead><tbody id="rows"></tbody></table></div></section></main>
<script>
const $=x=>document.getElementById(x);
const time=t=>new Intl.DateTimeFormat("de-DE",{dateStyle:"short",timeStyle:"medium"}).format(new Date(t*1000));
async function get(u){const r=await fetch(u+(u.includes("?")?"&":"?")+"_"+Date.now(),{cache:"no-store"});if(!r.ok)throw Error(r.status);return r.json();}
function chart(id,a,s){const e=$(id);if(!a.length){e.innerHTML="";return}const w=1000,h=260,p=24,min=Math.min(...a),max=Math.max(...a),d=max-min||1;
const pts=a.map((v,i)=>[p+i/(Math.max(1,a.length-1))*(w-2*p),h-p-(v-min)/d*(h-2*p)]).map(x=>x.join(",")).join(" ");
e.innerHTML=`<text x="${p}" y="18" fill="#94a3b8" font-size="13">${max.toFixed(1)}${s}</text><text x="${p}" y="${h-4}" fill="#94a3b8" font-size="13">${min.toFixed(1)}${s}</text><polyline points="${pts}" fill="none" stroke="#38bdf8" stroke-width="3"/>`;}
async function refresh(){try{const [l,h]=await Promise.all([get("/api/latest"),get("/api/history?limit=200")]);const m=l.measurement;
if(m){$("temp").textContent=m.temperature.toFixed(2)+" °C";$("hum").textContent=m.humidity.toFixed(2)+" %";$("time").textContent=time(m.timestamp);$("time2").textContent=time(m.timestamp);}
const a=h.measurements||[];chart("tc",a.map(x=>x.temperature)," °C");chart("hc",a.map(x=>x.humidity)," %");
$("rows").innerHTML=a.slice().reverse().slice(0,20).map(x=>`<tr><td>${time(x.timestamp)}</td><td>${x.temperature.toFixed(2)} °C</td><td>${x.humidity.toFixed(2)} %</td></tr>`).join("");
$("status").textContent=`Online · ${h.count} Messungen gespeichert`;}catch(e){$("status").textContent="Server nicht erreichbar";console.error(e);}}
refresh();setInterval(refresh,2000);
</script></body></html>
